[workspace]
resolver = "3"
members = [
    "crates/typesep-model",
    "crates/typesep-style",
    "crates/typesep-html",
    "crates/typesep-net",
    "crates/typesep-typst",
    "crates/typesep-epub",
    "crates/source-sep",
    "crates/source-lwp",
    "crates/typesep",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ijwino/typesep"

[workspace.dependencies]
typesep-model = { path = "crates/typesep-model" }
typesep-style = { path = "crates/typesep-style" }
typesep-html = { path = "crates/typesep-html" }
typesep-net = { path = "crates/typesep-net" }
typesep-typst = { path = "crates/typesep-typst" }
typesep-epub = { path = "crates/typesep-epub" }
source-sep = { path = "crates/source-sep" }
source-lwp = { path = "crates/source-lwp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dirs = "7"
thiserror = "2"
clap = { version = "4", features = ["derive", "wrap_help", "string"] }
clap_complete = "4"
clap_mangen = "0.2"
scraper = "0.27"
ego-tree = "0.11"
regex = "1"
tempfile = "3"
saphyr-parser = "0.0.12"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-html = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts"] }
mitex = "0.2.4"
time = "0.3"
ureq = { version = "3", features = ["gzip"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
roxmltree = "0.21"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
