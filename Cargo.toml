[workspace]
resolver = "3"
members = ["crates/sep-core", "crates/sep-typst", "crates/sep-epub", "crates/sep-cli", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ijwino/typesep"

[workspace.dependencies]
sep-core = { path = "crates/sep-core" }
sep-typst = { path = "crates/sep-typst" }
sep-epub = { path = "crates/sep-epub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dirs = "7"
thiserror = "2"
clap = { version = "4", features = ["derive", "wrap_help", "string"] }
clap_complete = "4"
clap_mangen = "0.2"
scraper = "0.27"
ego-tree = "0.11"
regex = "1"
tempfile = "3"
saphyr-parser = "0.0.12"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-html = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", default-features = false, features = ["scan-fonts"] }
mitex = "0.2.4"
time = "0.3"
ureq = { version = "3", features = ["gzip"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "symbols"
